bio: |
  Max Fleming is a physics and mathematics graduate of the Australian National
  University, where he completed first-class Honours with a thesis on
  non-perturbative spinor tunnelling in interacting quantum fields (graded 97%).
  His interests span quantum field theory, nuclear and particle physics, and
  quantum optics. He currently tutors and demonstrates across the ANU Research
  School of Physics, including as sole teaching assistant for Quantum Field
  Theory II.

